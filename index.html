
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Fun Facts</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #4f46e5, #2563eb);
      --card-bg: #ffffff;
      --accent: linear-gradient(135deg, #6366f1, #4f46e5);
      --text-dark: #1f2937;
      --text-muted: #6b7280;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      max-width: 350px;
      width: 90%;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .emoji {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      color: var(--text-dark);
      font-weight: 800;
    }

    .lead {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    #fact-box {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.5;
      padding: 25px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 35px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      width: 80%;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="emoji">🎉</div>
    <h1>Fun Fact Generator</h1>
    <p class="lead">Click the button to reveal a discovery!</p>
    
    <div id="fact-box">
      A jiffy is an actual unit of time equal to one trillionth of a second.
    </div>

    <button id="showFactButton" type="button">Get a Fun Fact</button>
  </main>

  <script>
    const facts = [
      "A jiffy is an actual unit of time equal to one trillionth of a second.",
      "Light travels so fast it could circle the Earth 7.5 times in just one second!",
      "Honeybees can fly higher than Mount Everest!",
      "Sea otters hold hands when they sleep so they don't drift apart.",
      "A blue whale's heart is the size of a small car!",
      "Bananas are berries, but strawberries aren't!"
    ];

    const factDisplay = document.getElementById("fact-box");
    const button = document.getElementById("showFactButton");

    button.addEventListener("click", function() {
      const randomIndex = Math.floor(Math.random() * facts.length);
      factDisplay.textContent = facts[randomIndex];
    });
  </script>

</body>
</html>
